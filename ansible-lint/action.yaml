name: "Run Ansible Lint"
inputs:
  ansible-requirements-file:
    description: "Path to the requirements.yml file to install role and collection dependencies"
    required: false
    default: "requirements.yml"
runs:
  using: composite
  steps:
    - name: Run ansible-lint
      uses: ansible/ansible-lint@v26.9.0
      with:
        #args: ""
        gh_action_ref: "v26.9.0"
        setup_python: "true"
        python_version: "3.14"
        #working_directory: ""
        requirements_file: ${{ inputs.ansible-requirements-file }}